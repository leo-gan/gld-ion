[workspace]
name = "mojo-ion"
version = "0.2.0"
description = "From-scratch Amazon Ion 1.0 and 1.1 library for Mojo"
authors = ["Leonid Ganeline"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.1.0"

[feature.oracle.dependencies]
python = ">=3.11"

[feature.bench.tasks]
microbench = "bash scripts/run-microbench.sh"

[environments]
default = { features = [] }
oracle = ["oracle"]
bench = ["bench"]

[tasks]
test = "bash scripts/run-tests.sh"
generate = "bash scripts/generate.sh"
precompile = "bash scripts/precompile.sh"
check-generated = "bash scripts/check-generated.sh"
